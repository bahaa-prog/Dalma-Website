# Nginx site config template for the Dalma website.
# Copy to /etc/nginx/sites-available/dalma, symlink into sites-enabled,
# replace YOUR_DOMAIN, then run `certbot --nginx -d YOUR_DOMAIN` to add TLS
# (certbot rewrites this file in place to add the 443 server block + redirect).

upstream dalma_web {
  server 127.0.0.1:3000;
}

server {
  listen 80;
  server_name YOUR_DOMAIN;

  # Admin-uploaded images served directly by Nginx — never touches Node.
  # Must match UPLOADS_DIR in .env.production.
  location /uploads/ {
    alias /var/www/dalma-uploads/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://dalma_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
